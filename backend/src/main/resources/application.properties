spring.application.name=menix-job-assistant
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/menixjobs;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.upload-dir=./uploads
app.remotive-url=${REMOTIVE_API_URL:https://remotive.com/api/remote-jobs?category=software-dev&limit=50}
app.greenhouse-boards=${GREENHOUSE_BOARD_TOKENS:}
app.lever-sites=${LEVER_SITE_NAMES:}
app.job-sync-cron=${JOB_SYNC_CRON:0 15 8 * * *}
logging.level.root=INFO
