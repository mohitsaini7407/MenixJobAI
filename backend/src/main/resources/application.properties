spring.application.name=menix-job-assistant
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/menixjobs;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.upload-dir=./uploads
app.greenhouse-boards=${GREENHOUSE_BOARD_TOKENS:}
app.lever-sites=${LEVER_SITE_NAMES:}
app.ashby-board-names=${ASHBY_BOARD_NAMES:}
app.workable-accounts=${WORKABLE_ACCOUNTS:}
app.smartrecruiters-companies=${SMARTRECRUITERS_COMPANIES:}
app.adzuna-app-id=${ADZUNA_APP_ID:}
app.adzuna-app-key=${ADZUNA_APP_KEY:}
app.adzuna-daily-call-cap=${ADZUNA_DAILY_CALL_CAP:200}
app.email-alert-imap-password=${EMAIL_ALERT_IMAP_PASSWORD:}
app.email-alert-key-file=${EMAIL_ALERT_KEY_FILE:}
app.public-job-feeds-enabled=${PUBLIC_JOB_FEEDS_ENABLED:false}
app.job-verification-max-age-hours=${JOB_VERIFICATION_MAX_AGE_HOURS:48}
app.retired-job-sources=${RETIRED_JOB_SOURCES:Remotive,Arbeitnow,Jobicy,RemoteOK}
logging.level.root=INFO
