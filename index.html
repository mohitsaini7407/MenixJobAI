<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src http://localhost:8080; img-src 'self' data:; child-src https:; frame-src https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menix Job Assistant</title>
  <link rel="icon" href="assets/menix.ico">
  <link rel="stylesheet" href="src/features/job-assistant/job-assistant.css">
  <link rel="stylesheet" href="src/features/job-assistant/browser-assistant.css">
</head>
<body>
  <header class="desktop-titlebar" aria-label="Application window controls">
    <div class="titlebar-identity"><img src="assets/menix.ico" alt=""><span>Menix Job Assistant</span></div>
    <div class="window-controls">
      <button class="window-control window-control-minimize" id="window-minimize" aria-label="Minimize window" title="Minimize"></button>
      <button class="window-control window-control-maximize" id="window-maximize" aria-label="Maximize window" title="Maximize"></button>
      <button class="window-control window-control-close" id="window-close" aria-label="Close window" title="Close"></button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="assets/menix.ico" alt="Menix logo"><div><strong>MENIX</strong><small>CAREER STUDIO</small></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard" title="Dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg> Dashboard</button>
        <button class="nav-item" data-page="jobs" title="Jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18m-11 0v2h4v-2"/></svg> Jobs</button>
        <button class="nav-item" data-page="browser" title="AutoApply"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg> AutoApply</button>
        <button class="nav-item" data-page="sources" title="Sources"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 8h-4a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4H9m3-10v2m0 8v2"/></svg> Sources</button>
        <button class="nav-item" data-page="applications" title="Applications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 12h8m-8 4h8"/></svg> Applications</button>
        <button class="nav-item" data-page="messages" title="Messages &amp; Outreach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2 1-4.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 10h8m-8 4h5"/></svg> Messages &amp; Outreach</button>
        <button class="nav-item" data-page="saved" title="Saved jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></svg> Saved</button>
        <button class="nav-item" data-page="interview" title="Interview prep"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m9 9 6 6m0-6-6 6"/></svg> Interview Prep</button>
        <button class="nav-item" data-page="profile" title="Resume and profile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17c.8-2 2.1-3 4-3s3.2 1 4 3"/></svg> Resume &amp; Profile</button>
        <button class="nav-item" data-page="settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.6-1.4-2.4 1.4-1.1a8 8 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1 0 1.7z" transform="translate(-1 -1)"/></svg> Settings</button>
      </nav>
      <div class="account-chip">
        <button class="account-avatar-button" id="change-account-avatar" type="button" title="Change profile photo" aria-label="Change profile photo">
          <span class="account-avatar" id="account-avatar">C</span>
          <img class="account-avatar-image" id="account-avatar-image" alt="" hidden>
          <span class="account-avatar-edit" aria-hidden="true">+</span>
        </button>
        <input id="account-avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <button class="account-profile-link" id="account-profile-link" type="button" title="Open candidate profile">
          <b id="account-name">Candidate</b><small>Resume &amp; profile</small>
        </button>
      </div>
      <div class="sidebar-bottom"><div class="status-dot"></div><div><b id="connection">Checking backend…</b><small>Local API connection</small></div></div>
    </aside>
    <main class="main">
      <section id="content" class="content"><div class="loading">Connecting to your local job assistant…</div></section>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <script src="src/features/job-assistant/smart-apply-memory.js"></script>
  <script src="src/features/job-assistant/autofill-engine.js"></script>
  <script src="src/features/job-assistant/job-assistant.js"></script>
</body>
</html>
